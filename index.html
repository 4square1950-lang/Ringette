<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f2e">
  <title>Ringette | Northern Circuit</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sport-shell.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <section id="home" class="page">
      <div class="viewport" id="homeIce"></div>
      <header class="home-head"><strong>RINGETTE</strong><nav aria-label="Account and help">
        <button data-open="profile">Profile</button><button data-open="settings">Settings</button>
        <details name="home-menu" class="help"><summary>Help</summary><div class="submenu">
          <button data-play="training">Training</button><button data-open="rules">Rules &amp; controls</button>
        </div></details>
      </nav></header>
      <div class="home-title"><p>Northern Circuit</p><h1>Ringette</h1></div>
      <footer class="home-footer">
        <nav aria-label="Game modes" class="home-modes">
          <details name="home-menu"><summary><span aria-hidden="true">▷</span> Play</summary><div class="submenu">
            <button data-play="single">Single player</button><button data-play="local">Multiplayer</button>
          </div></details>
          <details name="home-menu"><summary><span aria-hidden="true">◎</span> Campaign</summary><div class="submenu">
            <button id="resumeCampaign">Resume campaign</button><button data-open="map">World Tour</button><button data-open="venues">Venue tours</button>
          </div></details>
          <details name="home-menu"><summary><span aria-hidden="true">◇</span> Compete</summary><div class="submenu">
            <button data-open="tournaments">Tournaments</button><button data-open="stats">Stats</button><button data-open="standings">Standings</button>
          </div></details>
          <details name="home-menu"><summary><span aria-hidden="true">▧</span> Club</summary><div class="submenu">
            <a class="clan-hub-link " data-clan-game="ringette" href="http://localhost:4113/" target="_blank" rel="noopener">Clans</a><button data-open="clans">Local clubs</button><button data-open="studio">Character Studio</button><button data-open="players">Players</button>
            <button data-open="shop">Shop</button><button data-open="auctions">Auctions</button>
          </div></details>
        </nav>
        <div class="home-extras"><button id="motion">Pause background</button><span>Exhibition rink</span></div>
      </footer>
    </section>
    <section id="panel" class="page panel-page" hidden>
      <header><button id="panelBack" type="button" class="close" aria-label="Back">←</button><h1 id="panelTitle"></h1></header>
      <div id="panelContent"></div>
    </section>
    <section id="match" class="page" hidden>
      <div class="viewport" id="matchIce"></div>
      <div id="scoreboard" aria-label="Match scoreboard"><strong id="score"></strong><span id="time"></span><span id="shotClock"></span></div>
      <button id="pause" aria-label="Pause match">Ⅱ</button><p id="notice" role="status"></p>
      <p id="controls"></p>
    </section>
  </main>
  <dialog id="break"><h2>Paused</h2><button id="resume" class="primary">Resume</button><button id="quit">Leave match</button></dialog>
  <dialog id="result"><h2 id="resultTitle"></h2><p id="resultLine"></p><button id="resultNext" class="primary">Continue</button></dialog>
  <dialog id="campusTalk" aria-labelledby="campusTalkTitle"><h2 id="campusTalkTitle"></h2><p id="campusTalkLine"></p><button id="campusTalkAction" class="primary" hidden>Start training</button><button id="campusTalkClose">Close</button></dialog>
</body>
</html>
